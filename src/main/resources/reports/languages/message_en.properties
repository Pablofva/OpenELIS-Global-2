configuration.test.modify.guide.test              = <b>Nombre</b><span class="requiredlabel">*</span><br/><span class="tab">El nombre de la prueba tal como aparecer� dentro de openELIS. Se requieren tanto ingl�s como franc�s.</span><br/><b>Nombre de Reporte</b><span class="requiredlabel">*</span><br/><span class="tab">El nombre de la prueba tal como aparecer� en los informes. Se requieren tanto ingl�s como franc�s. Si el Nombre y el nombre de reporte son iguales, haz clic en el bot�n para copiar el nombre.</span><br/><b>Secci�n de Prueba</b><span class="requiredlabel">*</span><br/><span class="tab">La secci�n de la prueba en la que se realizar� la prueba.</span><br/><b>Panel</b><br/><span class="tab">Si esta prueba es parte de un panel de pruebas, entonces el panel puede ser a�adido aqu�. Es posible, pero no usual, que una prueba est� en m�s de un panel.</span><br/><b>Unidad de Medida (uom)</b><br/><span class="tab">Unidad de medida para la prueba. Esto generalmente solo se aplica a tipos de resultados num�ricos o alfanum�ricos.</span><br/><b>Tipo de Resultado</b><span class="requiredlabel">*</span><br/><span class="tab">El tipo de resultado para esta prueba:</span><br><br><span class="tab"><b>Num�rico</b> - Acepta solo resultados num�ricos en un cuadro de texto. Los resultados pueden ser evaluados para estar dentro de un rango normal o v�lido.</span><br><span class="tab"><b>Alfanum�rico</b> - Acepta resultados num�ricos o texto en un cuadro de texto. No ser� evaluado para estar dentro de un rango normal o v�lido.</span><br><span class="tab"><b>Texto libre</b> - Acepta hasta 200 caracteres en un �rea de texto. No ser� evaluado para estar dentro de un rango normal o v�lido.</span><br><span class="tab"><b>Lista de selecci�n</b> - El usuario podr� seleccionar de una lista desplegable. El valor normal ser� especificado como el valor de referencia.</span><br><span class="tab"><b>Lista de selecci�n m�ltiple</b> - El usuario podr� seleccionar uno o m�s valores de una lista desplegable. No se especificar� un valor de referencia.</span><br><span class="tab"><b>Lista de selecci�n m�ltiple en cascada</b> - Similar a la selecci�n m�ltiple, pero el usuario podr� seleccionar m�ltiples grupos de la lista desplegable.</span><br><br><b>Activo</b><br/><span class="tab">Si la prueba est� activa, puede ser ordenada en el formulario de �rdenes o como parte de un algoritmo de pruebas. Si no est� activa, no puede ser ordenada ni ser parte de un algoritmo de pruebas.</span><br><b>Ordenable</b><br/><span class="tab">Si una prueba est� activa y ordenable, entonces puede ser ordenada en un formulario de �rdenes. Si est� activa pero no ordenable, entonces solo se realizar� si es reflexionada desde otra prueba.</span><br>
