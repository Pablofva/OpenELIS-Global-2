configuration.test.add.guide.result.limits        = <b>Resumen</b><br><span class="tab">Los l�mites de resultados indican los rangos de resultados normales y v�lidos para la nueva prueba. Los rangos pueden depender del sexo y la edad del paciente. Las entradas se expandir�n a medida que se realicen las selecciones.</span><br><br><b>Dependiente del sexo</b><br/><span class="tab">�Los l�mites para este rango dependen del sexo del paciente? Si se selecciona, entonces se dar� otro rango normal para el rango de edad.</span><br><br><b>Rango de edad</b><br/><span class="tab">El extremo superior del rango de edad para los valores normales. El rango de edad inferior ser� 0 o el valor del rango anterior. La edad puede estar en meses 'M' o a�os 'Y'. Tambi�n hay algunos rangos de edad predefinidos en el men� desplegable. El valor ingresado debe ser mayor que el rango de edad inferior.</span><br><br><b>Rango</b><br/><span class="tab">Los valores inferior y superior para el rango normal. El rango inferior debe ser menor que el rango superior. Si el rango normal se da como menor que un valor ( '\\< 15 g/l), entonces la entrada ser�a un rango de 0-15.</span><br><br><b>Rango de reporte</b><br/><span class="tab">El rango que se utilizar� en los informes. Si el rango es \\< 15 g/l, entonces se ingresar� como 0-15 en los campos de rango y \\< 15 en este campo.</span><br><br><b>Rango v�lido</b><br/><span class="tab">El rango v�lido para esta prueba.</span><br><br><b>D�gitos significativos</b><br/><span class="tab">El n�mero de d�gitos significativos para los resultados. Por ejemplo: si los d�gitos significativos son 2 y se ingresa un resultado de 5, entonces el resultado se registrar� como 5.00. Si el resultado se ingresa como 5.237, entonces el resultado se registrar� como 5.24. 0 no es lo mismo que vac�o. 0 significa que los resultados son solo n�meros enteros. Un vac�o significa que lo que sea ingresado es lo que se registrar�.</span><br><br>
