configuration.test.modify.guide.select.list       = La lista de opciones de la lista de selección puede ser añadida una a una desde el menú desplegable o puede ser seleccionada de un conjunto existente.<br><span class="tab"><b>Opciones de lista de selección</b><span class="requiredlabel">*</span> La lista de valores de resultados existentes. A medida que se hace una selección, también se añadirá al orden de resultados, valor de referencia y Calificadores.</span><br><span class="tab"><b>Orden de resultados</b> El orden en que los valores aparecerán al ingresar resultados. El orden puede cambiarse arrastrando una opción hacia arriba o hacia abajo en la lista.</span><br><span class="tab"><b>Valor de referencia</b> El resultado que se esperaría de una persona 'normal'.</span><br><span class="tab"><b>Calificadores</b> Si un valor está marcado como calificado, entonces si ese valor es el resultado de un análisis, se presentará un cuadro de texto para información adicional.</span><br><span class="tab"><b>Conjuntos de pruebas existentes</b> Una forma conveniente de añadir conjuntos de resultados disponibles. Se basan en conjuntos existentes que ya han sido ingresados en el sistema. Seleccionar un conjunto reemplazará cualquier selección ya hecha.</span><br>
configuration.test.modify.guide.test              = <b>Nombre</b><span class="requiredlabel">*</span><br/><span class="tab">El nombre de la prueba tal como aparecerá dentro de openELIS. Se requieren tanto inglés como francés.</span><br/><b>Nombre de Reporte</b><span class="requiredlabel">*</span><br/><span class="tab">El nombre de la prueba tal como aparecerá en los informes. Se requieren tanto inglés como francés. Si el Nombre y el nombre de reporte son iguales, haz clic en el botón para copiar el nombre.</span><br/><b>Sección de Prueba</b><span class="requiredlabel">*</span><br/><span class="tab">La sección de la prueba en la que se realizará la prueba.</span><br/><b>Panel</b><br/><span class="tab">Si esta prueba es parte de un panel de pruebas, entonces el panel puede ser añadido aquí. Es posible, pero no usual, que una prueba esté en más de un panel.</span><br/><b>Unidad de Medida (uom)</b><br/><span class="tab">Unidad de medida para la prueba. Esto generalmente solo se aplica a tipos de resultados numéricos o alfanuméricos.</span><br/><b>Tipo de Resultado</b><span class="requiredlabel">*</span><br/><span class="tab">El tipo de resultado para esta prueba:</span><br><br><span class="tab"><b>Numérico</b> - Acepta solo resultados numéricos en un cuadro de texto. Los resultados pueden ser evaluados para estar dentro de un rango normal o válido.</span><br><span class="tab"><b>Alfanumérico</b> - Acepta resultados numéricos o texto en un cuadro de texto. No será evaluado para estar dentro de un rango normal o válido.</span><br><span class="tab"><b>Texto libre</b> - Acepta hasta 200 caracteres en un área de texto. No será evaluado para estar dentro de un rango normal o válido.</span><br><span class="tab"><b>Lista de selección</b> - El usuario podrá seleccionar de una lista desplegable. El valor normal será especificado como el valor de referencia.</span><br><span class="tab"><b>Lista de selección múltiple</b> - El usuario podrá seleccionar uno o más valores de una lista desplegable. No se especificará un valor de referencia.</span><br><span class="tab"><b>Lista de selección múltiple en cascada</b> - Similar a la selección múltiple, pero el usuario podrá seleccionar múltiples grupos de la lista desplegable.</span><br><br><b>Activo</b><br/><span class="tab">Si la prueba está activa, puede ser ordenada en el formulario de órdenes o como parte de un algoritmo de pruebas. Si no está activa, no puede ser ordenada ni ser parte de un algoritmo de pruebas.</span><br><b>Ordenable</b><br/><span class="tab">Si una prueba está activa y ordenable, entonces puede ser ordenada en un formulario de órdenes. Si está activa pero no ordenable, entonces solo se realizará si es reflexionada desde otra prueba.</span><br>
