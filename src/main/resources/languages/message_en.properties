configuration.test.add.guide.result.limits        = <b>Resumen</b><br><span class="tab">Los límites de resultados indican los rangos de resultados normales y válidos para la nueva prueba. Los rangos pueden depender del sexo y la edad del paciente. Las entradas se expandirán a medida que se realicen las selecciones.</span><br><br><b>Dependiente del sexo</b><br/><span class="tab">¿Los límites para este rango dependen del sexo del paciente? Si se selecciona, entonces se dará otro rango normal para el rango de edad.</span><br><br><b>Rango de edad</b><br/><span class="tab">El extremo superior del rango de edad para los valores normales. El rango de edad inferior será 0 o el valor del rango anterior. La edad puede estar en meses 'M' o años 'Y'. También hay algunos rangos de edad predefinidos en el menú desplegable. El valor ingresado debe ser mayor que el rango de edad inferior.</span><br><br><b>Rango</b><br/><span class="tab">Los valores inferior y superior para el rango normal. El rango inferior debe ser menor que el rango superior. Si el rango normal se da como menor que un valor ( '\\< 15 g/l), entonces la entrada sería un rango de 0-15.</span><br><br><b>Rango de reporte</b><br/><span class="tab">El rango que se utilizará en los informes. Si el rango es \\< 15 g/l, entonces se ingresará como 0-15 en los campos de rango y \\< 15 en este campo.</span><br><br><b>Rango válido</b><br/><span class="tab">El rango válido para esta prueba.</span><br><br><b>Dígitos significativos</b><br/><span class="tab">El número de dígitos significativos para los resultados. Por ejemplo: si los dígitos significativos son 2 y se ingresa un resultado de 5, entonces el resultado se registrará como 5.00. Si el resultado se ingresa como 5.237, entonces el resultado se registrará como 5.24. 0 no es lo mismo que vacío. 0 significa que los resultados son solo números enteros. Un vacío significa que lo que sea ingresado es lo que se registrará.</span><br><br>
configuration.test.add.guide.sample.type          = <span class="tab">Selecciona uno o más tipos de muestra. Si seleccionas más de un tipo de muestra, entonces la prueba debe ser idéntica en todos los aspectos para cada tipo de muestra.</span><br><br><span class="tab">Después de seleccionar el tipo de muestra, el orden en el que aparecerá la nueva prueba, mostrada en verde, puede cambiarse arrastrándola hacia arriba o hacia abajo. El orden determinará el orden en que las pruebas se muestran en el formulario de entrada de órdenes después de seleccionar un tipo de muestra.<br></span>
configuration.test.add.guide.select.list          = La lista de opciones de la lista de selección puede ser añadida una a una desde el menú desplegable o puede ser seleccionada de un conjunto existente.<br><span class="tab"><b>Opciones de lista de selección</b><span class="requiredlabel">*</span> La lista de valores de resultados existentes. A medida que se hace una selección, también se añadirá al orden de resultados, valor de referencia y Calificadores.</span><br><span class="tab"><b>Orden de resultados</b> El orden en que los valores aparecerán al ingresar resultados. El orden puede cambiarse arrastrando una opción hacia arriba o hacia abajo en la lista.</span><br><span class="tab"><b>Valor de referencia</b> El resultado que se esperaría de una persona 'normal'.</span><br><span class="tab"><b>Calificadores</b> Si un valor está marcado como calificado, entonces si ese valor es el resultado de un análisis, se presentará un cuadro de texto para información adicional.</span><br><span class="tab"><b>Conjuntos de pruebas existentes</b> Una forma conveniente de añadir conjuntos de resultados disponibles. Se basan en conjuntos existentes que ya han sido ingresados en el sistema. Seleccionar un conjunto reemplazará cualquier selección ya hecha.</span><br>
configuration.test.add.guide.test                 = <b>Nombre</b><span class="requiredlabel">*</span><br/><span class="tab">El nombre de la prueba tal como aparecerá dentro de openELIS. Se requieren tanto inglés como francés.</span><br/><b>Nombre de Reporte</b><span class="requiredlabel">*</span><br/><span class="tab">El nombre de la prueba tal como aparecerá en los informes. Se requieren tanto inglés como francés. Si el Nombre y el nombre de reporte son iguales, haz clic en el botón para copiar el nombre.</span><br/><b>Sección de Prueba</b><span class="requiredlabel">*</span><br/><span class="tab">La sección de la prueba en la que se realizará la prueba.</span><br/><b>Panel</b><br/><span class="tab">Si esta prueba es parte de un panel de pruebas, entonces el panel puede ser añadido aquí. Es posible, pero no usual, que una prueba esté en más de un panel.</span><br/><b>Unidad de Medida (uom)</b><br/><span class="tab">Unidad de medida para la prueba. Esto generalmente solo se aplica a tipos de resultados numéricos o alfanuméricos.</span><br/><b>Tipo de Resultado</b><span class="requiredlabel">*</span><br/><span class="tab">El tipo de resultado para esta prueba:</span><br><br><span class="tab"><b>Numérico</b> - Acepta solo resultados numéricos en un cuadro de texto. Los resultados pueden ser evaluados para estar dentro de un rango normal o válido.</span><br><span class="tab"><b>Alfanumérico</b> - Acepta resultados numéricos o texto en un cuadro de texto. No será evaluado para estar dentro de un rango normal o válido.</span><br><span class="tab"><b>Texto libre</b> - Acepta hasta 200 caracteres en un área de texto. No será evaluado para estar dentro de un rango normal o válido.</span><br><span class="tab"><b>Lista de selección</b> - El usuario podrá seleccionar de una lista desplegable. El valor normal será especificado como el valor de referencia.</span><br><span class="tab"><b>Lista de selección múltiple</b> - El usuario podrá seleccionar uno o más valores de una lista desplegable. No se especificará un valor de referencia.</span><br><span class="tab"><b>Lista de selección múltiple en cascada</b> - Similar a la selección múltiple, pero el usuario podrá seleccionar múltiples grupos de la lista desplegable.</span><br><br><b>Activo</b><br/><span class="tab">Si la prueba está activa, puede ser ordenada en el formulario de órdenes o como parte de un algoritmo de pruebas. Si no está activa, no puede ser ordenada ni ser parte de un algoritmo de pruebas.</span><br><b>Ordenable</b><br/><span class="tab">Si una prueba está activa y ordenable, entonces puede ser ordenada en un formulario de órdenes. Si está activa pero no ordenable, entonces solo se realizará si es reflexionada desde otra prueba.</span><br>
configuration.test.add.guide.verify               = <b>Verifica que todos los valores sean correctos y acepta la nueva entrada o navega para cambiar los valores incorrectos.</b>
