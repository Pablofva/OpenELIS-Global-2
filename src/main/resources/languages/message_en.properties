systemuserrole.instruction                = <h3> Roles </h3> Existen dos tipos de Roles. Roles Globales que se establecen para toda la aplicación y Roles de Unidad de Laboratorio que pueden establecerse para todas las Unidades de Laboratorio o para Unidades de Laboratorio específicas. <br><br>Los Roles Globales disponibles son: Administrador Global (Acceso a todas las Funciones Administrativas), Auditoría (Acceso a toda la Auditoría), <br>User Account Administrator (tiene acceso a todas las funciones de administración de cuentas de usuario, pero no a otras funciones administrativas) <br><br>Los Roles de Unidad de Laboratorio son: Recepción (Acceso a las pestañas de Orden, Paciente y No Conformidad), Resultados (Acceso a las pestañas de Plan de Trabajo, No Conformidad y Resultados), Validación (Acceso a las pestañas de Validación y No Conformidad), <br>Informes (Acceso a la pestaña de Informes excepto exportación CSV, solo Disponible para Administradores Globales). <br>Para asignar Roles de Unidad de Laboratorio, selecciona todas las unidades de laboratorio o la unidad de laboratorio específica desde el desplegable y selecciona cualquier rol que desees establecer. <br><br>También puedes usar la Función de Copiar Permisos para copiar los permisos de un usuario existente. Asegúrate de haber llenado toda la información arriba y de ingresar el nombre del usuario cuyos permisos deseas copiar en el recuadro y haz clic en aplicar.
