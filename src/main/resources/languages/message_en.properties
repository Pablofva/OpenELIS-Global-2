configuration.test.catalog.guide                  = <b>Nombre</b><br/><span class="tab">El nombre de la prueba tal como aparecerá dentro de openELIS. Se muestran tanto inglés como francés.</span><br/><b>Nombre de Reporte</b><br/><span class="tab">El nombre de la prueba tal como aparecerá en los informes. Se muestran tanto inglés como francés.</span><br/><b>Activo/No Activo</b><br/><span class="tab">Si la prueba está activa, puede ser ordenada en el formulario de órdenes o como parte de un algoritmo de pruebas. Si no está activa, no puede ser ordenada ni ser parte de un algoritmo de pruebas.</span><br/><b>Ordenable/No Ordenable</b><br/><span class="tab">Si una prueba está activa y ordenable, entonces puede ser ordenada en un formulario de órdenes. Si está activa pero no ordenable, entonces solo se realizará si es reflexionada desde otra prueba.</span><br/><b>Unidad de Prueba</b><br/><span class="tab">Qué sección del laboratorio realiza la prueba. Esto también se conoce como sección de prueba.</span><br/><b>Tipo de Muestra</b><br/><span class="tab">El tipo de muestra sobre el cual se puede realizar la prueba. Si el técnico de ingreso puede seleccionar el tipo de muestra después de haber ordenado la prueba, se marcará como usuario para indicar que el usuario seleccionará el tipo.</span><br/><b>Panel</b><br/><span class="tab">Si esta prueba es parte de un panel de pruebas, entonces el panel será nombrado aquí.</span><br/><b>Tipo de Resultado</b><br/><span class="tab">El tipo de resultado para esta prueba</span><UL><li>N - Numérico. Acepta solo resultados numéricos en un cuadro de texto. Los resultados pueden ser evaluados para estar dentro de un rango normal o válido.</li><li>A - Alfanumérico. Acepta resultados numéricos o texto en un cuadro de texto. No será evaluado para estar dentro de un rango normal o válido.</li><li>R - Texto libre. Acepta hasta 200 caracteres en un área de texto. No será evaluado para estar dentro de un rango normal o válido.</li><li>D - Lista de selección. El usuario podrá seleccionar de una lista desplegable. El valor normal será especificado como el valor de referencia.</li><li>M - Lista de selección múltiple. El usuario podrá seleccionar uno o más valores de una lista desplegable. No se especificará un valor de referencia.</li><li>C - Lista de selección múltiple en cascada. Similar a la selección múltiple, pero el usuario podrá seleccionar múltiples grupos de la lista desplegable.</li></UL><br/><b>Unidad de Medida (uom)</b><br/><span class="tab">Unidad de medida para la prueba. Esto generalmente solo se aplica a tipos de resultados numéricos o alfanuméricos.</span><br/><b>Dígitos significativos</b><br/><span class="tab">El número de dígitos significativos para resultados numéricos. Los resultados ingresados serán redondeados o completados al número correcto de dígitos. Por ejemplo: si los dígitos significativos son 2 y se ingresa un resultado de 5, entonces el resultado se registrará como 5.00. Si el resultado se ingresa como 5.237, entonces el resultado se registrará como 5.24. 0 no es lo mismo que vacío. 0 significa que los resultados son solo números enteros. Un vacío significa que lo que sea ingresado es lo que se registrará.</span><br/><b>Valores de selección</b><br/><span class="tab">Solo especificado para resultados de tipo lista de selección, selección múltiple o selección múltiple en cascada. Estos son las selecciones disponibles que se mostrarán al usuario. Si la selección está marcada como "calificable", entonces cuando el usuario seleccione ese valor, podrá ingresar información adicional en un cuadro de texto.</span><br/><b>Valor de referencia</b><br/><span class="tab">El valor de una selección para una persona sana. Solo se da para resultados de tipo lista de selección.</span><br/><b>Límites de resultados</b><br/><span class="tab">Los límites de resultados normales y válidos para pruebas numéricas. Los valores pueden depender tanto de la edad como del sexo del paciente.</span><br/><b>Sexo</b><br/><span class="tab">Si el sexo del paciente es relevante para los valores dados, se especificará aquí.</span><br/><b>Rango de edad</b><br/><span class="tab">Si el rango de edad (en meses) es relevante para los valores dados, se especificará aquí.</span><br/><b>Rango normal</b><br/><span class="tab">Cualquier resultado numérico dentro de este rango es lo que se espera en una persona sana.</span><br/><b>Rango válido</b><br/><span class="tab">Cualquier resultado numérico fuera de este rango es una indicación de que la prueba puede no haberse realizado correctamente.</span><br/><br/><b>Nota:</b><br/><span class="tab">n/a significa no disponible. El valor no está especificado.</span>
